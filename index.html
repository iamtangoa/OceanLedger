<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OceanLedger</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d5c63">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OceanLedger">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#eef3f1;--card:#fff;--tx:#12303a;--mu:#5d7780;--pr:#0d5c63;--pt:#fff;--ac:#e0562b;--bd:#cddbd8;--ok:#1b7f4b;--bad:#c23a2b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1a1f;--card:#12292f;--tx:#e4f0ee;--mu:#8fadaa;--pr:#4cc0c0;--pt:#062024;--ac:#ff8a5c;--bd:#26434a;--ok:#4cc27f;--bad:#ef7a6c}}
:root[data-theme="dark"]{--bg:#0a1a1f;--card:#12292f;--tx:#e4f0ee;--mu:#8fadaa;--pr:#4cc0c0;--pt:#062024;--ac:#ff8a5c;--bd:#26434a;--ok:#4cc27f;--bad:#ef7a6c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Segoe UI",Tahoma,system-ui,sans-serif}
header{background:var(--pr);color:var(--pt);padding:10px 14px 0;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
h1{margin:0 0 6px;font-size:20px;letter-spacing:.3px}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{flex:1;background:none;border:0;color:inherit;padding:9px 6px;opacity:.75;border-bottom:3px solid transparent;border-radius:0;font-weight:600}
nav button.on{opacity:1;border-color:var(--ac)}
main{max-width:760px;margin:0 auto;padding:12px}
h3{margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin:8px 0}
.tap{cursor:pointer;border-inline-start:4px solid var(--pr)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:8px 0}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}
.row>label:has(input[type=checkbox]),.row>label:has(input[type=radio]){flex-direction:row;align-items:center;font-size:15px;color:var(--tx)}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;min-height:38px;max-width:100%}
input[type=checkbox],input[type=radio]{min-height:0;width:18px;height:18px}
button{cursor:pointer;background:var(--card);font-weight:600}
button.pr{background:var(--pr);color:var(--pt);border-color:var(--pr)}
button.bad{color:var(--bad);border-color:var(--bad)}
.mu{color:var(--mu);font-size:13px}.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad)}
.kv{display:flex;justify-content:space-between;padding:2px 0}
.big{font-size:20px}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:5px 8px;border-bottom:1px solid var(--bd);text-align:start;white-space:nowrap}
#box{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:14px;z-index:9}
#box .card{width:100%;max-width:560px}
textarea{width:100%;height:200px;font:12px monospace}
@media print{header,button,#box{display:none!important}body{background:#fff;color:#000}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chip{border-radius:999px;padding:6px 14px}.chip.on{background:var(--pr);color:var(--pt);border-color:var(--pr)}
</style></head><body>
<header><h1>🌊 OceanLedger</h1><nav id="nav"></nav></header>
<main id="main"></main><div id="box"></div>
<script>
const L={
fa:{trips:'سفرها',reports:'گزارش‌ها',crew:'خدمه',settings:'تنظیمات',newTrip:'سفر جدید',date:'تاریخ',from:'از',to:'تا',income:'درآمد ماهی',fish:'انواع ماهی',fishType:'نوع ماهی',kg:'مقدار (کیلو)',pricePerKg:'قیمت هر کیلو',addFish:'افزودن ماهی',fishTotal:'جمع درآمد ماهی',expenses:'هزینه‌ها',net:'سود خالص',owner:'صاحب قایق',captain:'ناخدا',worker:'خدمه',earned:'سهم',paid:'پرداخت‌شده',balance:'مانده',pay:'پرداخت',save:'ذخیره',del:'حذف',back:'بازگشت',edited:'ویرایش‌شده',cat:'دسته',qty:'مقدار',unit:'واحد',price:'قیمت واحد',total:'جمع',note:'یادداشت',why:'دلیل تغییر',boat:'قایق',ownerPct:'سهم مالک ٪',capShare:'سهم ناخدا',bonus:'پاداش ناخدا (سهم از مالک)',cur:'واحد پول',lang:'زبان',theme:'تم',tl:'روشن',td:'تیره',ta:'خودکار',addCrew:'افزودن',name:'نام',share:'سهم',none:'هنوز چیزی نیست',export:'خروجی CSV',backup:'پشتیبان / بازیابی',print:'چاپ / PDF',period:'دوره (YYYY یا YYYY-MM)',months:'ماه‌ها',years:'سال‌ها',byCat:'هزینه به تفکیک دسته',expCats:'دسته‌های هزینه و واحد پیش‌فرض',addCat:'افزودن دسته',addBoat:'افزودن قایق',port:'بندر',ownerName:'نام مالک',copy:'کپی',load:'بارگذاری داده',sure:'مطمئنید؟',all:'جمع کل',payAmt:'مبلغ',close:'بستن',draft:'پیش‌نویس ذخیره‌نشده',cont:'ادامه',discard:'حذف پیش‌نویس',clear:'پاک کردن مقدار'},
en:{trips:'Trips',reports:'Reports',crew:'Crew',settings:'Settings',newTrip:'New trip',date:'Date',from:'From',to:'To',income:'Fish income',fish:'Fish types',fishType:'Fish type',kg:'Weight (kg)',pricePerKg:'Price per kg',addFish:'Add fish',fishTotal:'Total fish income',expenses:'Expenses',net:'Net profit',owner:'Boat owner',captain:'Captain',worker:'Crew',earned:'Earned',paid:'Paid',balance:'Balance',pay:'Pay',save:'Save',del:'Delete',back:'Back',edited:'Edited',cat:'Category',qty:'Qty',unit:'Unit',price:'Unit price',total:'Total',note:'Notes',why:'Reason for change',boat:'Boat',ownerPct:'Owner share %',capShare:'Captain shares',bonus:'Captain bonus (shares from owner)',cur:'Currency',lang:'Language',theme:'Theme',tl:'Light',td:'Dark',ta:'Auto',addCrew:'Add',name:'Name',share:'Shares',none:'Nothing yet',export:'Export CSV',backup:'Backup / restore',print:'Print / PDF',period:'Period (YYYY or YYYY-MM)',months:'Months',years:'Years',byCat:'Expenses by category',expCats:'Expense categories and default units',addCat:'Add category',addBoat:'Add boat',port:'Port',ownerName:'Owner name',copy:'Copy',load:'Load data',sure:'Sure?',all:'Totals',payAmt:'Amount',close:'Close',draft:'Unsaved draft',cont:'Continue',discard:'Discard draft',clear:'Clear values'},
ar:{trips:'الرحلات',reports:'التقارير',crew:'الطاقم',settings:'الإعدادات',newTrip:'رحلة جديدة',date:'التاريخ',from:'من',to:'إلى',income:'دخل السمك',fish:'أنواع السمك',fishType:'نوع السمك',kg:'الوزن (كغ)',pricePerKg:'سعر الكيلو',addFish:'إضافة سمك',fishTotal:'إجمالي دخل السمك',expenses:'المصروفات',net:'صافي الربح',owner:'مالك القارب',captain:'القبطان',worker:'الطاقم',earned:'المستحق',paid:'المدفوع',balance:'المتبقي',pay:'دفع',save:'حفظ',del:'حذف',back:'رجوع',edited:'معدّل',cat:'الفئة',qty:'الكمية',unit:'الوحدة',price:'سعر الوحدة',total:'الإجمالي',note:'ملاحظات',why:'سبب التعديل',boat:'القارب',ownerPct:'حصة المالك ٪',capShare:'حصص القبطان',bonus:'مكافأة القبطان (حصص من المالك)',cur:'العملة',lang:'اللغة',theme:'المظهر',tl:'فاتح',td:'داكن',ta:'تلقائي',addCrew:'إضافة',name:'الاسم',share:'الحصص',none:'لا شيء بعد',export:'تصدير CSV',backup:'نسخ احتياطي / استعادة',print:'طباعة / PDF',period:'الفترة (YYYY أو YYYY-MM)',months:'الأشهر',years:'السنوات',byCat:'المصروفات حسب الفئة',expCats:'فئات المصروفات والوحدات الافتراضية',addCat:'إضافة فئة',addBoat:'إضافة قارب',port:'الميناء',ownerName:'اسم المالك',copy:'نسخ',load:'تحميل البيانات',sure:'متأكد؟',all:'الإجمالي',payAmt:'المبلغ',close:'إغلاق',draft:'مسودة غير محفوظة',cont:'متابعة',discard:'حذف المسودة',clear:'مسح القيم'},
tr:{trips:'Seferler',reports:'Raporlar',crew:'Mürettebat',settings:'Ayarlar',newTrip:'Yeni sefer',date:'Tarih',from:'Başlangıç',to:'Bitiş',income:'Balık geliri',fish:'Balık türleri',fishType:'Balık türü',kg:'Miktar (kg)',pricePerKg:'Kg fiyatı',addFish:'Balık ekle',fishTotal:'Toplam balık geliri',expenses:'Giderler',net:'Net kâr',owner:'Tekne sahibi',captain:'Kaptan',worker:'Mürettebat',earned:'Hak ediş',paid:'Ödenen',balance:'Kalan',pay:'Öde',save:'Kaydet',del:'Sil',back:'Geri',edited:'Düzenlendi',cat:'Kategori',qty:'Miktar',unit:'Birim',price:'Birim fiyat',total:'Toplam',note:'Notlar',why:'Değişiklik nedeni',boat:'Tekne',ownerPct:'Sahip payı %',capShare:'Kaptan payı',bonus:'Kaptan primi (sahipten pay)',cur:'Para birimi',lang:'Dil',theme:'Tema',tl:'Açık',td:'Koyu',ta:'Otomatik',addCrew:'Ekle',name:'Ad',share:'Paylar',none:'Henüz yok',export:'CSV dışa aktar',backup:'Yedekle / geri yükle',print:'Yazdır / PDF',period:'Dönem (YYYY veya YYYY-AA)',months:'Aylar',years:'Yıllar',byCat:'Kategoriye göre giderler',expCats:'Gider kategorileri ve varsayılan birimler',addCat:'Kategori ekle',addBoat:'Tekne ekle',port:'Liman',ownerName:'Sahip adı',copy:'Kopyala',load:'Veriyi yükle',sure:'Emin misin?',all:'Genel toplam',payAmt:'Tutar',close:'Kapat',draft:'Kaydedilmemiş taslak',cont:'Devam',discard:'Taslağı sil',clear:'Değerleri temizle'}};
const LN={fa:'فارسی',en:'English',ar:'العربية',tr:'Türkçe'};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9),n=v=>parseFloat(v)||0,K='oceanledger.v1';
const DC=()=>[{n:'ماچله',u:'پلاستیک'},{n:'جیم',u:'کیلو'},{n:'بنزین',u:'چلیکه'},{n:'روغن',u:'بطری'},{n:'یخ',u:'گونی'},{n:'دیگر',u:''}];
const DB=()=>({id:'b1',name:'قایق ۱',port:'',owner:'',op:50,cs:1,bs:1});
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{v:2,set:{lang:'fa',theme:'light',cur:'تومان',cats:DC()},boats:[DB()],crew:[],trips:[],draft:null,edit:false};
if(S.v!==2){S.v=2;S.set.lang='fa';S.set.theme='light';S.set.cur='تومان';S.set.cats=DC();S.boats.forEach(b=>{b.bs=1;delete b.bonus;if(b.name==='Boat 1')b.name='قایق ۱'});S.trips.forEach(x=>{x.fish=x.inc?[{id:uid(),type:'ماهی',kg:1,price:n(x.inc)}]:[];delete x.inc;x.bonus=1});S.draft=null;S.edit=false}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const t=k=>(L[S.set.lang]||L.fa)[k]||L.fa[k]||k;
const fmt=v=>{const c=S.set.cur,l=S.set.lang;try{if(/^[A-Za-z]{3}$/.test(c))return new Intl.NumberFormat(l,{style:'currency',currency:c.toUpperCase()}).format(v);return new Intl.NumberFormat(l,{maximumFractionDigits:0}).format(v)+' '+c}catch(e){return Math.round(v)+' '+c}};
const bname=id=>(S.boats.find(b=>b.id===id)||{name:'?'}).name;
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
let view='trips',draft=S.draft||null,armed='',flt={from:'',to:''},rp='';
const fishTot=x=>(x.fish||[]).reduce((a,f)=>a+n(f.kg)*n(f.price),0);
const catNames=d=>[...new Set([...S.set.cats.map(c=>c.n),...d.ex.map(e=>e.cat)])];
const mkEx=c=>({id:uid(),cat:c,qty:'',unit:(S.set.cats.find(x=>x.n===c)||{u:''}).u,price:'',total:'',note:'',man:false});

function calc(x){const inc=fishTot(x),exp=x.ex.reduce((a,e)=>a+n(e.total),0),net=inc-exp,sh=x.mem.reduce((a,m)=>a+n(m.share),0),pool=net*(1-n(x.op)/100),u=sh?pool/sh:0,bon=x.mem.some(m=>m.cap)?n(x.bonus)*u:0,own=net*n(x.op)/100-bon;
 const p=x.mem.map(m=>{const earned=n(m.share)*u+(m.cap?bon:0),paid=x.pays.filter(q=>q.id===m.id).reduce((a,q)=>a+n(q.amt),0);return{...m,earned,paid,bal:earned-paid}});
 return{inc,exp,net,own,pool,p}}

function render(){const s=S.set,r=document.documentElement;r.lang=s.lang;r.dir=(s.lang==='fa'||s.lang==='ar')?'rtl':'ltr';
 s.theme?r.dataset.theme=s.theme:delete r.dataset.theme;
 const ed=draft&&S.edit&&view==='trips';
 $('#nav').innerHTML=['trips','reports','crew','settings'].map(v=>`<button class="${v===view?'on':''}" data-act="nav" data-v="${v}">${t(v)}</button>`).join('');
 $('#main').innerHTML=ed?edHtml():view==='trips'?trHtml():view==='reports'?rpHtml():view==='crew'?crHtml():stHtml();
 if(ed)upd()}

const list=()=>S.trips.filter(x=>(!flt.from||x.date>=flt.from)&&(!flt.to||x.date<=flt.to)).sort((a,b)=>b.date.localeCompare(a.date));
function trHtml(){const l=list();return `<div class="row"><label>${t('from')}<input type="date" data-flt="from" value="${flt.from}"></label><label>${t('to')}<input type="date" data-flt="to" value="${flt.to}"></label></div>
${draft?`<div class="card" style="border-color:var(--ac)"><b>✎ ${t('draft')}</b> — ${draft.date}<div class="row"><button class="pr" data-act="cont">${t('cont')}</button><button class="bad" data-act="discard">${armed==='dr'?t('sure'):t('discard')}</button></div></div>`:`<div class="row"><button class="pr" data-act="new">+ ${t('newTrip')}</button></div>`}
<div class="row"><button data-act="csv">${t('export')}</button></div>
${l.map(x=>{const c=calc(x),due=c.p.reduce((a,p)=>a+Math.max(0,p.bal),0);return `<div class="card tap" data-act="open" data-id="${x.id}"><b>${x.date}</b> — ${esc(bname(x.boat))}<div class="mu">${t('income')}: ${fmt(c.inc)} | ${t('net')}: ${fmt(c.net)}</div>${due>.005?`<div class="bad">${t('balance')}: ${fmt(due)}</div>`:'<div class="ok">✓</div>'}</div>`}).join('')||`<p class="mu">${t('none')}</p>`}`}

function edHtml(){const d=draft,num=(v,a)=>`<input type="number" step="any" inputmode="decimal" ${a} value="${esc(v)}">`,names=catNames(d);
 if(!d.sel||!names.includes(d.sel))d.sel=names[0];
 let ei=d.ex.findIndex(e=>e.cat===d.sel);if(ei<0&&d.sel){d.ex.push(mkEx(d.sel));ei=d.ex.length-1}
 const e=d.ex[ei],a=f=>`data-e="${ei}" data-f="${f}"`,types=[...new Set(S.trips.flatMap(x=>x.fish||[]).concat(d.fish).map(f=>f.type).filter(Boolean))];
return `<button data-act="back">← ${t('back')}</button>
<div class="card"><div class="grid"><label>${t('date')}<input type="date" data-k="date" value="${d.date}"></label>
<label>${t('boat')}<select data-bk="1">${S.boats.map(b=>`<option value="${b.id}" ${b.id===d.boat?'selected':''}>${esc(b.name)}</option>`).join('')}</select></label>
<label>${t('ownerPct')}${num(d.op,'data-k="op"')}</label>
<label>${t('bonus')}${num(d.bonus,'data-k="bonus"')}</label></div></div>
<h3>${t('fish')}</h3><datalist id="ft">${types.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
${d.fish.map((f,i)=>{const a=k=>`data-fi="${i}" data-f="${k}"`;return `<div class="card"><div class="grid"><label>${t('fishType')}<input list="ft" ${a('type')} value="${esc(f.type)}"></label><label>${t('kg')}${num(f.kg,a('kg'))}</label><label>${t('pricePerKg')}${num(f.price,a('price'))}</label><label>${t('total')}<b id="fr-${i}">${fmt(n(f.kg)*n(f.price))}</b></label></div><button class="bad" data-act="rmfish" data-i="${i}">${t('del')}</button></div>`}).join('')}
<button data-act="addfish">+ ${t('addFish')}</button>
<div class="kv big"><span>${t('fishTotal')}</span><b id="ftot">${fmt(fishTot(d))}</b></div>
<h3>${t('expenses')}</h3>
<div class="chips">${names.map((c,i)=>{const x=d.ex.find(e=>e.cat===c),tt=x?n(x.total):0;return `<button class="chip ${c===d.sel?'on':''}" data-act="sel" data-i="${i}">${esc(c)}${tt?' · '+fmt(tt):''}</button>`}).join('')}</div>
${e?`<div class="card"><div class="grid">
<label>${t('qty')}${num(e.qty,a('qty'))}</label><label>${t('unit')}<input ${a('unit')} value="${esc(e.unit)}"></label>
<label>${t('price')}${num(e.price,a('price'))}</label><label>${t('total')}${num(e.total,a('total'))}</label>
<label>${t('note')}<input ${a('note')} value="${esc(e.note)}"></label></div>
${e.orig!==undefined?`<label>${t('why')}<input ${a('why')} value="${esc(e.why)}"></label>`:''}
${e.h&&e.h.length?`<div class="mu">✎ ${t('edited')}: ${e.h.map(h=>`${new Date(h.at).toLocaleString()}: ${fmt(h.o)} → ${fmt(h.n)}${h.w?' ('+esc(h.w)+')':''}`).join(' | ')}</div>`:''}
<button data-act="clr">${t('clear')}</button></div>`:''}
<h3>${t('crew')}</h3>
${S.crew.map(c=>{const m=d.mem.find(m=>m.id===c.id),a=f=>`data-m="${c.id}" data-f="${f}"`;return `<div class="card row"><label><input type="checkbox" ${a('on')} ${m?'checked':''}> ${esc(c.name)}</label>${m?`<label>${t('share')}${num(m.share,a('share'))}</label><label><input type="radio" name="cap" ${a('cap')} ${m.cap?'checked':''}> ${t('captain')}</label>`:''}</div>`}).join('')||`<p class="mu">${t('none')} → ${t('crew')}</p>`}
<div id="sum"></div>
<div class="row"><button class="pr" data-act="save">${t('save')}</button>${d.saved?`<button class="bad" data-act="del">${armed===d.id?t('sure'):t('del')}</button>`:''}<button data-act="print">${t('print')}</button></div>`}

function upd(){const d=draft,c=calc(d),kv=(a,b,x='')=>`<div class="kv ${x}"><span>${a}</span><b>${b}</b></div>`;
$('#sum').innerHTML=`<div class="card">${kv(t('income'),fmt(c.inc))}${kv(t('expenses'),fmt(c.exp))}${kv(t('net'),fmt(c.net),'big')}${kv(t('owner')+' ('+n(d.op)+'%)',fmt(c.own))}</div>`+
c.p.map(p=>`<div class="card"><b>${esc(p.name)}</b> <span class="mu">${p.cap?t('captain'):t('worker')} × ${p.share}</span> ${p.bal<=.005&&p.earned>0?'<span class="ok">✓</span>':''}
${kv(t('earned'),fmt(p.earned))}${kv(t('paid'),fmt(p.paid))}${kv(t('balance'),fmt(p.bal))}
<div class="row"><input id="pa-${p.id}" type="number" step="any" placeholder="${t('payAmt')}: ${p.bal>0?Math.round(p.bal):''}"><button data-act="pay" data-id="${p.id}">${t('pay')}</button></div>
${d.pays.filter(q=>q.id===p.id).map(q=>`<div class="mu">${new Date(q.at).toLocaleDateString()} — ${fmt(n(q.amt))}</div>`).join('')}</div>`).join('')}

function commit(back){const d=draft;if(!d.date)return false;
 d.ex=d.ex.filter(e=>n(e.total)!==0||e.orig!==undefined||e.note);d.fish=d.fish.filter(f=>f.type||n(f.kg)||n(f.price));
 d.ex.forEach(e=>{const v=n(e.total);if(e.orig!==undefined&&e.orig!==v)(e.h=e.h||[]).push({at:Date.now(),o:e.orig,n:v,w:e.why||''});e.total=v;e.orig=v;e.why=''});
 d.saved=true;const c=JSON.parse(JSON.stringify(d)),i=S.trips.findIndex(x=>x.id===d.id);i<0?S.trips.push(c):S.trips[i]=c;if(back){draft=null;S.edit=false}save();return true}

function rpHtml(){const l=S.trips.filter(x=>x.date.startsWith(rp)),M={},Y={},P={},C={},z=()=>({inc:0,exp:0,net:0,own:0}),T=z();
 l.forEach(x=>{const c=calc(x);[[M,x.date.slice(0,7)],[Y,x.date.slice(0,4)],[{t:T},'t']].forEach(([o,k])=>{const r=o[k]=o[k]||z();r.inc+=c.inc;r.exp+=c.exp;r.net+=c.net;r.own+=c.own});
  c.p.forEach(p=>{const r=P[p.id]=P[p.id]||{name:p.name,e:0,p:0};r.e+=p.earned;r.p+=p.paid});
  x.ex.forEach(e=>C[e.cat]=(C[e.cat]||0)+n(e.total))});
 const row=(k,r)=>`<tr><td>${esc(k)}</td><td>${fmt(r.inc)}</td><td>${fmt(r.exp)}</td><td>${fmt(r.net)}</td><td>${fmt(r.own)}</td></tr>`,
 head=`<tr><th></th><th>${t('income')}</th><th>${t('expenses')}</th><th>${t('net')}</th><th>${t('owner')}</th></tr>`;
 return `<div class="row"><label>${t('period')}<input data-rp="1" value="${esc(rp)}" placeholder="2026"></label><button data-act="csv">${t('export')}</button><button data-act="print">${t('print')}</button></div>
<div class="card sc"><table>${head}${row(t('all'),T)}</table></div>
<h3>${t('months')}</h3><div class="card sc"><table>${head}${Object.keys(M).sort().map(k=>row(k,M[k])).join('')}</table></div>
<h3>${t('years')}</h3><div class="card sc"><table>${head}${Object.keys(Y).sort().map(k=>row(k,Y[k])).join('')}</table></div>
<h3>${t('crew')}</h3><div class="card sc"><table><tr><th></th><th>${t('earned')}</th><th>${t('paid')}</th><th>${t('balance')}</th></tr>${Object.values(P).map(r=>`<tr><td>${esc(r.name)}</td><td>${fmt(r.e)}</td><td>${fmt(r.p)}</td><td>${fmt(r.e-r.p)}</td></tr>`).join('')}</table></div>
<h3>${t('byCat')}</h3><div class="card sc"><table>${Object.keys(C).map(k=>`<tr><td>${esc(k)}</td><td>${fmt(C[k])}</td></tr>`).join('')}</table></div>`}

${S.crew.map(c=>`<div class="card row"><b style="flex:1">${esc(c.name)}</b><button class="bad" data-act="rmcrew" data-id="${c.id}">${armed===c.id?t('sure'):t('del')}</button></div>`).join('')||`<p class="mu">${t('none')}</p>`}`;

<label>${t('ownerPct')}<input type="number" step="any" ${a('op')} value="${b.op}"></label><label>${t('capShare')}<input type="number" step="any" ${a('cs')} value="${b.cs}"></label><label>${t('bonus')}<input type="number" step="any" ${a('bs')} value="${b.bs}"></label></div></div>`}).join('')}

function box(title,text,onload){const b=$('#box');b.style.display='flex';b.innerHTML=`<div class="card"><b>${esc(title)}</b><textarea id="bx"></textarea><div class="row"><button data-act="cp">${t('copy')}</button><button data-act="dl">⬇</button>${onload?`<button class="pr" data-act="ld">${t('load')}</button>`:''}<button data-act="cl">${t('close')}</button></div></div>`;$('#bx').value=text;box.f=onload}
function csv(){const q=r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(','),R=[[t('date'),t('boat'),t('income'),t('expenses'),t('net'),t('owner'),t('name'),t('worker'),t('earned'),t('paid'),t('balance')]],E=[[t('date'),t('cat'),t('qty'),t('unit'),t('price'),t('total'),t('note')]],F=[[t('date'),t('fishType'),t('kg'),t('pricePerKg'),t('total')]];
 list().forEach(x=>{const c=calc(x),b=[x.date,bname(x.boat),c.inc,c.exp,Math.round(c.net),Math.round(c.own)];if(!c.p.length)R.push(b);c.p.forEach(p=>R.push([...b,p.name,p.cap?t('captain'):t('worker'),Math.round(p.earned),Math.round(p.paid),Math.round(p.bal)]));x.ex.forEach(e=>E.push([x.date,e.cat,e.qty,e.unit,e.price,n(e.total),e.note]));(x.fish||[]).forEach(f=>F.push([x.date,f.type,f.kg,f.price,n(f.kg)*n(f.price)]))});
 box('CSV',[R,F,E].map(r=>r.map(q).join('\n')).join('\n\n'))}

document.addEventListener('click',ev=>{const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,d=draft;
 if(a==='nav'){view=b.dataset.v}
 else if(a==='new'){if(!draft){const bt=S.boats[0];draft={id:uid(),date:today(),boat:bt.id,fish:[],op:bt.op,bonus:bt.bs,ex:[],mem:[],pays:[],saved:false}}S.edit=true;view='trips'}
 else if(a==='open'){if(!draft)draft=JSON.parse(JSON.stringify(S.trips.find(x=>x.id===b.dataset.id)));S.edit=true;view='trips'}
 else if(a==='cont'){S.edit=true}
 else if(a==='discard'){if(armed==='dr'){draft=null;S.edit=false;armed=''}else armed='dr'}
 else if(a==='back')S.edit=false;
 else if(a==='sel')d.sel=catNames(d)[+b.dataset.i];
 else if(a==='clr'){const e=d.ex.find(e=>e.cat===d.sel);if(e){e.qty=e.price=e.total='';e.man=false}}
 else if(a==='addfish')d.fish.push({id:uid(),type:'',kg:'',price:''});
 else if(a==='rmfish')d.fish.splice(+b.dataset.i,1);
 else if(a==='save'){if(!commit(true))return}
 else if(a==='del'){if(armed===d.id){S.trips=S.trips.filter(x=>x.id!==d.id);draft=null;S.edit=false;armed=''}else armed=d.id}
 else if(a==='pay'){const c=calc(d).p.find(p=>p.id===b.dataset.id),v=n($('#pa-'+c.id).value)||c.bal;if(v<=0)return;d.pays.push({id:c.id,amt:v,at:Date.now()});commit(false)}
 else if(a==='print')window.print();
 else if(a==='csv'){csv();return}
 else if(a==='addcrew'){const v=$('#cn').value.trim();if(!v)return;S.crew.push({id:uid(),name:v})}
 else if(a==='rmcrew'){if(armed===b.dataset.id){S.crew=S.crew.filter(c=>c.id!==armed);armed=''}else armed=b.dataset.id}
 else if(a==='addboat')S.boats.push({...DB(),id:uid(),name:'قایق '+(S.boats.length+1)});
 else if(a==='addcat')S.set.cats.push({n:'',u:''});
 else if(a==='rmcat')S.set.cats.splice(+b.dataset.i,1);
 else if(a==='theme')S.set.theme=S.set.theme==='light'?'dark':S.set.theme==='dark'?'':'light';
 else if(a==='bk'){box(t('backup'),JSON.stringify(S),txt=>{S=JSON.parse(txt);save();draft=S.draft||null;$('#box').style.display='none';render()});return}
 else if(a==='cp'){$('#bx').select();try{document.execCommand('copy')}catch(e){}return}
 else if(a==='dl'){try{const u=URL.createObjectURL(new Blob(['\ufeff'+$('#bx').value],{type:'text/plain'})),l=document.createElement('a');l.href=u;l.download='oceanledger-'+today()+'.txt';l.click()}catch(e){}return}
 else if(a==='ld'){try{box.f($('#bx').value)}catch(e){$('#bx').value='Invalid data'}return}
 else if(a==='cl'){$('#box').style.display='none';return}
 S.draft=draft;save();render()});

document.addEventListener('input',ev=>{const el=ev.target,D=el.dataset;if(el.tagName==='SELECT'||el.type==='checkbox'||el.type==='radio')return;
 if(D.rp!==undefined){rp=el.value;return}
 if(D.s){S.set[D.s]=el.value;save();return}
 if(D.ca){S.set.cats[+D.ca][D.f]=el.value;save();return}
 if(D.bo){S.boats[+D.bo][D.f]=['op','cs','bs'].includes(D.f)?n(el.value):el.value;save();return}
 if(!draft)return;const d=draft;
 if(D.k)d[D.k]=el.value;
 else if(D.fi!==undefined){const f=d.fish[+D.fi];f[D.f]=el.value;const o=$('#fr-'+D.fi);if(o)o.textContent=fmt(n(f.kg)*n(f.price));$('#ftot').textContent=fmt(fishTot(d))}
 else if(D.e!==undefined){const e=d.ex[+D.e],f=D.f;e[f]=el.value;
  if(f==='total')e.man=el.value!=='';
  if((f==='qty'||f==='price'||f==='total')&&!e.man){e.total=String(+((e.qty===''?1:n(e.qty))*n(e.price)).toFixed(2));const o=document.querySelector(`[data-e="${D.e}"][data-f="total"]`);if(o)o.value=e.total}}
 else if(D.m&&D.f==='share')d.mem.find(m=>m.id===D.m).share=el.value;
 S.draft=d;save();upd()});

document.addEventListener('change',ev=>{const el=ev.target,D=el.dataset;
 if(D.flt){flt[D.flt]=el.value;render();return}
 if(D.lang){S.set.lang=el.value;save();render();return}
 if(!draft)return;const d=draft;
 if(D.bk){d.boat=el.value;const b=S.boats.find(b=>b.id===el.value);d.op=b.op;d.bonus=b.bs}
 else if(D.m){const c=S.crew.find(c=>c.id===D.m);
  if(D.f==='on'){el.checked?d.mem.push({id:c.id,name:c.name,share:'1',cap:false}):d.mem=d.mem.filter(m=>m.id!==D.m)}
  if(D.f==='cap'){d.mem.forEach(m=>m.cap=false);const m=d.mem.find(m=>m.id===D.m);m.cap=true;if(m.share==='1')m.share=String(S.boats.find(b=>b.id===d.boat).cs)}}
 else return;
 S.draft=d;save();render()});
